name: Diagnose arXiv OAI connectivity (read-only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/diagnose_arxiv_oai_connectivity.py'
      - '.github/workflows/diagnose-arxiv-oai-connectivity.yml'
permissions:
  contents: read
jobs:
  connectivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe arXiv endpoints without harvesting
        run: python scripts/diagnose_arxiv_oai_connectivity.py
