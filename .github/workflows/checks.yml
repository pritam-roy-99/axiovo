name: Validate proposed Axiovo changes
on:
  pull_request:
  push:
    branches:
      - 'feature/**'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify internal navigation and assets
        run: python scripts/audit_internal_links.py
      - name: Security and privacy baseline checks
        run: python scripts/security_audit.py
      - name: JavaScript and page validation
        run: python -m scripts.validate_site
      - name: JavaScript regression tests
        run: |
          for test in tests/*.test.js; do
            node "$test"
          done

  browser-smoke:
    name: Smoke test Axiovo in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Verify current pages and connected workflows
        run: |
          python scripts/smoke_routes.py
          python scripts/smoke_archive_pages.py
          python scripts/smoke_search_links.py
          python scripts/smoke_feed.py
          python scripts/smoke_feed_worker.py
          python scripts/smoke_recommendations.py
