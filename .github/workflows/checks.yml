name: Validate proposed Axiovo changes
on:
  pull_request:
  push:
    branches:
      - 'feature/**'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate PWA launcher icons before asset checks
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          source=Path("docs/icons/axiovo.svg")
          for size in (192,512):
              target=Path(f"docs/icons/axiovo-{size}.png")
              cairosvg.svg2png(url=str(source),write_to=str(target),output_width=size,output_height=size)
              assert target.stat().st_size>1000
          PY
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify internal navigation and assets
        run: python scripts/audit_internal_links.py
      - name: Security and privacy baseline checks
        run: python scripts/security_audit.py
      - name: JavaScript and page validation
        run: python -m scripts.validate_site
      - name: JavaScript regression tests
        run: |
          for test in tests/*.test.js; do
            node "$test"
          done
          node tests/version-aware-display.test.cjs

  browser-smoke:
    name: Smoke test Axiovo in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate PWA icons for browser offline-shell acceptance
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          source=Path("docs/icons/axiovo.svg")
          for size in (192,512):
              target=Path(f"docs/icons/axiovo-{size}.png")
              cairosvg.svg2png(url=str(source),write_to=str(target),output_width=size,output_height=size)
              assert target.stat().st_size>1000
          PY
      - name: Install browser test tools
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Verify current pages and connected workflows
        run: |
          python scripts/smoke_routes.py
          python scripts/smoke_archive_pages.py
          python scripts/smoke_eprint.py
          python scripts/smoke_search_links.py
          python scripts/smoke_feed.py
          python scripts/smoke_feed_worker.py
          python scripts/smoke_recommendations.py
