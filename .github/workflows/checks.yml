name: Validate proposed ResearchLens changes
on:
  pull_request:
  push:
    branches:
      - 'feature/**'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify internal navigation and assets
        run: python scripts/audit_internal_links.py
      - name: Security and privacy baseline checks
        run: python scripts/security_audit.py
      - name: Local device backup regression tests
        run: node tests/local-backup.test.js
      - name: JavaScript and page validation
        run: python -m scripts.validate_site
      - name: Research relevance tests
        run: node tests/relevance.test.js
      - name: Unified research assistant regression tests
        run: |
          node tests/assistant-core.test.js
          node tests/field-taxonomy.test.js
          node tests/author-follow.test.js
          node tests/author-search.test.js
          node tests/inspire-author.test.js
          node tests/multisource-search.test.js
          node tests/zotero-feedback.test.js
          node tests/library-outside-cache.test.js
      - name: Test personalized research interest controls
        run: node tests/interests.test.js
      - name: User-editable research field hierarchy tests
        run: node tests/custom-taxonomy.test.js
      - name: Scholarly field relevance regression tests
        run: node tests/scholar-search.test.js
      - name: AI semantic search precision tests
        run: node tests/semantic-search.test.js
      - name: Exact arXiv version and history link tests
        run: node tests/arxiv-versions.test.js
      - name: Unified discovery focus selection tests
        run: node tests/focus-bar.test.js
      - name: Test rate-limited arXiv fallback
        run: node tests/cached-arxiv-search.test.js
      - name: Build homepage video preview
        run: |
          python -m pip install --disable-pip-version-check Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python scripts/build_intro_video.py
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 docs/assets/researchlens-tour.mp4
          test -s docs/assets/researchlens-tour-poster.jpg
          test -s docs/assets/researchlens-tour.vtt

  browser-smoke:
    name: Smoke test ResearchLens in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run local ResearchLens browser walkthrough
        run: |
          python3 -m http.server 8765 --directory docs >/tmp/researchlens-server.log 2>&1 &
          sleep 2
          node tests/site-browser-smoke.cjs
