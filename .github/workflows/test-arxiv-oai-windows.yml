name: Test arXiv OAI date-window recovery
on:
  pull_request:
    paths:
      - 'scripts/arxiv_oai_windows.py'
      - 'scripts/arxiv_oai_completed_import.py'
      - 'tests/test_arxiv_oai_completed_import.py'
      - 'scripts/arxiv_oai_history.py'
      - 'tests/test_arxiv_oai_windows.py'
      - '.github/workflows/test-arxiv-oai-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify window recovery and syntax
        run: |
          python -m unittest discover -s tests -p 'test_arxiv_oai_windows.py' -v
          python -m unittest discover -s tests -p 'test_arxiv_oai_completed_import.py' -v
          python -m py_compile scripts/arxiv_oai_windows.py scripts/arxiv_oai_completed_import.py
