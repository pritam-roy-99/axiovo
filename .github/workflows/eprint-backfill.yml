name: Backfill IACR ePrint OAI metadata safely
on:
  workflow_dispatch:
  schedule:
    # Historical OAI metadata update intervals are harvested a bounded year at a time.
    - cron: '40 2 * * *'
permissions:
  contents: write
concurrency:
  group: axiovo-eprint-history
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source and resumable backfill integrity
        run: |
          python -m unittest discover -s tests -p 'test_eprint_harvest.py' -v
          python -m unittest discover -s tests -p 'test_eprint_backfill.py' -v
      - name: Traverse full available OAI history with adaptive date splitting
        env:
          IACR_BACKFILL_WINDOWS: '30'
          IACR_BACKFILL_PAGES: '70'
          IACR_BACKFILL_SPLITS: '60'
        run: python -m scripts.backfill_eprint
      - name: Commit verified IACR metadata and its non-skipping checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in docs/data/eprint.json docs/data/eprint-backfill-state.json; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "data: advance validated IACR ePrint OAI history [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
