name: Publication integrity
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  publication-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate static website and coverage manifests
        run: python scripts/release_gate.py
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find docs -maxdepth 1 -type f -name '*.js' -print0)
