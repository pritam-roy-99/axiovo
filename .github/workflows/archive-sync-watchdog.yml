name: Archive synchronization watchdog
on:
  workflow_run:
    workflows: ['Verify and deploy Axiovo']
    types: [completed]
  workflow_dispatch:
  schedule:
    # Independent fallback, fifteen minutes after the primary 30-minute cadence.
    # GitHub-hosted cron is best-effort and can be delayed or skipped.
    - cron: '22,52 * * * *'
permissions:
  actions: write
  contents: read
concurrency:
  group: axiovo-archive-watchdog
  cancel-in-progress: false
jobs:
  ensure-recent-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch archive synchronization if no recent attempt exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo "## Archive sync watchdog" >> "$GITHUB_STEP_SUMMARY"
          now=$(date -u +%s)
          # Query the primary workflow directly, rather than unrelated repo actions.
          runs=$(gh api "repos/$GH_REPO/actions/workflows/sync-all-sources.yml/runs?per_page=20")
          recent=$(jq -r --argjson now "$now" '
            [.workflow_runs[] |
              select(.event == "schedule" or .event == "workflow_dispatch" or .event == "push") |
              select(($now - (.created_at | sub("Z$"; "Z") | fromdateiso8601)) >= 0) |
              select(($now - (.created_at | sub("Z$"; "Z") | fromdateiso8601)) < 2400)
            ] | length' <<< "$runs")
          echo "- Recent primary attempts (past 40 min): $recent" >> "$GITHUB_STEP_SUMMARY"
          if [ "$recent" -eq 0 ]; then
            gh workflow run sync-all-sources.yml --repo "$GH_REPO" --ref main
            echo "- Recovery: dispatched primary synchronization." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Recovery: not needed; a recent primary run exists." >> "$GITHUB_STEP_SUMMARY"
          fi
          # A green workflow does not mean every individual archive was fetched:
          # those source steps intentionally continue-on-error to preserve data.
          # Inspect the most recent completed sync's per-source steps as well.
          latest_id=$(jq -r '[.workflow_runs[] | select(.status == "completed")] | first | .id // empty' <<< "$runs")
          if [ -n "$latest_id" ]; then
            jobs=$(gh api "repos/$GH_REPO/actions/runs/$latest_id/jobs?per_page=30")
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Last completed run: per-archive results" >> "$GITHUB_STEP_SUMMARY"
            echo "| Source | Fetch step |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            for entry in \
              'arXiv OAI|Synchronize arXiv all-category OAI metadata' \
              'arXiv rolling feed|Rebuild arXiv rolling feed' \
              'bioRxiv|Synchronize official bioRxiv API' \
              'ChemRxiv|Synchronize verified ChemRxiv records' \
              'Cryptology ePrint|Synchronize Cryptology ePrint OAI'; do
              archive="${entry%%|*}"
              step="${entry#*|}"
              outcome=$(jq -r --arg step "$step" '[.jobs[].steps[]? | select(.name == $step) | .conclusion] | first // "not-run"' <<< "$jobs")
              echo "| $archive | $outcome |" >> "$GITHUB_STEP_SUMMARY"
              if [ "$outcome" != "success" ]; then
                echo "::warning::$archive latest completed fetch: $outcome (run $latest_id). Old verified data may still be shown."
              fi
            done
          else
            echo "::warning::No completed primary archive sync exists among the latest attempts."
          fi
          echo "- Note: GitHub scheduled workflows are best-effort. This watchdog is a fallback, not a guarantee of exact 15-minute execution." >> "$GITHUB_STEP_SUMMARY"
