name: Diagnose official arXiv announcements (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: axiovo-arxiv-diagnostic
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify announcement parser and RSS ordering
        run: |
          python -m unittest discover -s tests -p 'test_arxiv_catchup.py' -v
          python -m unittest discover -s tests -p 'test_arxiv_announcement_order.py' -v
      - name: Inspect cached official announcement date
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/data/announcements.json')
          j=json.loads(p.read_text(encoding='utf8'))
          print('Announcement date:',j.get('announcement_date'))
          print('Count:',j.get('count'))
          print('Complete:',j.get('complete'))
          print('Source:',j.get('source'))
          PY
# Publication is owned exclusively by sync-all-sources.yml.
# This manual diagnostic must never write data or trigger a deployment.
