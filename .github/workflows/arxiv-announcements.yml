name: Synchronize official arXiv announcements
on:
  push:
    branches: [main]
    paths:
      - scripts/arxiv_announcements.py
      - scripts/scirate_latest.py
      - .github/workflows/arxiv-announcements.yml
  workflow_dispatch:
  schedule:
    # Frequent post-announcement and overnight RSS checks, UTC.
    # arXiv's RSS snapshot is usually refreshed at midnight Eastern.
    - cron: '25,55 0,1,2,3 * * 1-5'
    - cron: '12,42 4,5,6,7 * * 1-5'
    - cron: '37 9,15,21 * * 1-5'
permissions:
  contents: write
  actions: write
concurrency:
  group: axiovo-announcement-harvest
  cancel-in-progress: false
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harvest arXiv on announcement and RSS publication schedules
        run: |
          # Official announcements normally begin at 20:00 Eastern.
          # RSS is usually refreshed around midnight Eastern, hours later.
          # Before RSS refresh use official Atom search; after refresh prefer
          # the category-by-category official RSS announcement inventory.
          hour=$(date -u +%H)
          if [ "$hour" -lt 4 ]; then
            python -m scripts.scirate_latest || python -m scripts.arxiv_announcements
          else
            python -m scripts.arxiv_announcements || python -m scripts.scirate_latest
          fi
      - name: Protect against stale or incomplete arXiv regressions
        run: python scripts/validate_sync_snapshots.py
      - name: Check announcement JSON integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/data/announcements.json")
          j = json.loads(p.read_text())
          assert j["date_type"] == "announcement"
          assert j["count"] == len(j["papers"]) > 0
          assert len(set(x["id"] for x in j["papers"])) == j["count"]
          print("Verified", j["announcement_date"], j["count"], "papers, complete =", j["complete"])
          PY
      - name: Commit new announcement snapshot
        id: announcement_commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/announcements.json
          if ! git diff --cached --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git commit -m 'data: publish latest official arXiv announcements'
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
      # Never deploy raw docs/ from this job: the tutorial MP4 and captions
      # are build artifacts, not tracked files. A direct deploy would delete
      # them from the live site after every arXiv announcement update.
      - name: Rebuild the complete site after announcement refresh
        if: steps.announcement_commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
