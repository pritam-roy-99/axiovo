name: ProofLab tests
on:
  pull_request:
    paths:
      - 'docs/prooflab*'
      - 'docs/copilot.html'
      - 'tests/prooflab.test.js'
      - '.github/workflows/prooflab-tests.yml'
  push:
    branches: [main]
    paths:
      - 'docs/prooflab*'
      - 'tests/prooflab.test.js'
jobs:
  prooflab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check docs/prooflab-core.js
          node --check docs/prooflab.js
      - name: Run ProofLab unit tests
        run: node --test tests/prooflab.test.js
