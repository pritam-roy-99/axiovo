name: Seed and backfill complete arXiv submission dates
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/arxiv-archive-backfill.yml
      - scripts/arxiv_daily_archive.py
      - tests/test_arxiv_daily_archive.py
      - docs/arxiv-daily-archive.js
      - scripts/audit_literature_coverage.py
      - tests/test_literature_coverage.py
  schedule:
    # Independent SciRate-style ingestion: revisit closed UTC dates and
    # gradually backfill older gaps without competing with hourly OAI pulls.
    - cron: '23 4,12,20 * * *'
  workflow_dispatch:
    inputs:
      from_date:
        description: "UTC first submission date (YYYY-MM-DD), optional"
        required: false
        type: string
      to_date:
        description: "UTC last submission date (YYYY-MM-DD), optional; maximum 31 days"
        required: false
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: axiovo-date-archive-backfill
  cancel-in-progress: false
jobs:
  backfill:
    name: Harvest all arXiv first submissions for verified UTC dates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate complete archive data logic
        run: |
          python -m unittest discover -s tests -p test_arxiv_daily_archive.py -v
          node tests/arxiv-daily-archive.test.js
      - name: Harvest selected or latest arXiv dates
        env:
          AXIOVO_ARCHIVE_FROM: ${{ inputs.from_date }}
          AXIOVO_ARCHIVE_TO: ${{ inputs.to_date }}
          AXIOVO_DAILY_BACKFILL_COUNT: "5"
        run: python -m scripts.arxiv_daily_archive
      - name: Validate repair queue from published source counts
        run: |
          python -m unittest discover -s tests -p test_literature_coverage.py -v
          python -m scripts.audit_literature_coverage
      - name: Publish only complete source-verified date shards
        id: archive_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/arxiv-days/ docs/data/literature-health.json
          if ! git diff --cached --quiet; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git commit -m "data: complete arXiv submission-day archive"
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
      - name: Rebuild published site with verified archive data
        if: steps.archive_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
