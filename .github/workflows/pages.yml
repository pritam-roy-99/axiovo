name: Verify and deploy Axiovo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Video generation and browser audits are long-running. Source metadata pushes
# must not cancel a healthy publication halfway through rendering. GitHub
# retains only the newest queued run in the same concurrency group.
concurrency:
  group: axiovo-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate Android PNG launcher icons from current Axiovo logo
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python - <<'PY'
          import cairosvg
          from pathlib import Path
          source=Path("docs/icons/axiovo.svg")
          for size in (192,512):
              target=Path(f"docs/icons/axiovo-{size}.png")
              cairosvg.svg2png(url=str(source),write_to=str(target),output_width=size,output_height=size)
              assert target.stat().st_size>1000
          PY
      - name: Test metadata processing
        id: test_metadata_processing
        run: python -m unittest discover -s tests -v
      - name: Security and privacy baseline gate (deployment required)
        id: security_and_privacy_baseline_gate
        run: python scripts/security_audit.py
      - name: Validate local data restore safety
        id: validate_local_data_restore_safety
        continue-on-error: true
        run: node tests/local-backup.test.js
      - name: Validate website scripts (deployment required)
        id: validate_website_scripts
        run: python -m scripts.validate_site
      - name: Research Assistant relevance and cited-answer regression gate
        id: assistant_relevance
        run: |
          node --check docs/copilot.js
          node --check docs/assistant-core.js
          node tests/assistant-core.test.js
          node tests/assistant-grounding-50.test.js
      - name: Test Research Assistant exact identifiers and public fallback (required)
        id: assistant_exact
        run: node tests/copilot-retrieval.test.js
      - name: Verify exact per-paper citations and reject cross-paper counts (required)
        id: citations_exact
        run: node tests/citation-evidence.test.js
      - name: Test source identity, announcement freshness and precision ranking
        id: source_identity
        run: |
          node tests/archive-data.test.js
          node tests/search-recall.test.js
          node tests/search-accuracy.test.js
          node tests/latest-topic-scope.test.js
          node tests/recent-archive-scope.test.js
          node tests/topic-report.test.js
      - name: Check source-backed five-paper comparison extraction
        id: comparison_extraction
        run: node tests/evidence-extract.test.js
      - name: Test research relevance ranking
        id: test_research_relevance_ranking
        continue-on-error: true
        run: node tests/relevance.test.js
      - name: Evaluate fifty source-grounded bibliography queries (required)
        id: bibliography_fifty
        run: node tests/assistant-grounding-50.test.js
      - name: Unified research assistant regression tests
        id: unified_research_assistant_regression_tests
        continue-on-error: true
        run: |
          node tests/assistant-core.test.js
          node tests/field-taxonomy.test.js
          node tests/author-follow.test.js
          node tests/author-search.test.js
          node tests/inspire-author.test.js
          node tests/multisource-search.test.js
          node tests/zotero-feedback.test.js
          node tests/library-outside-cache.test.js
      - name: Test field-interest preferences
        id: test_field_interest_preferences
        continue-on-error: true
        run: node tests/interests.test.js
      - name: Validate discipline-specific search
        id: validate_discipline_specific_search
        continue-on-error: true
        run: node tests/scholar-search.test.js
      - name: AI semantic search precision tests
        id: ai_semantic_search_precision_tests
        continue-on-error: true
        run: node tests/semantic-search.test.js
      - name: Exact arXiv version and history link tests
        id: exact_arxiv_version_and_history_link_tests
        continue-on-error: true
        run: node tests/arxiv-versions.test.js
      - name: Validate shared Discover focus
        id: validate_shared_discover_focus
        continue-on-error: true
        run: node tests/focus-bar.test.js
      - name: Test rate-limited arXiv fallback and date archive
        id: test_rate_limited_arxiv_fallback_and_date_archive
        continue-on-error: true
        run: |
          node tests/cached-arxiv-search.test.js
          node tests/arxiv-daily-archive.test.js
      - name: Verify three-source metadata harvester regression tests (required)
        id: source_harvest
        run: python -m unittest discover -s tests -p test_source_harvest.py -v
      - name: Validate independent ePrint source and offline recovery (required)
        id: eprint_independent
        run: node tests/eprint-independent.test.js
      - name: Validate IACR ePrint OAI-PMH metadata parser
        id: eprint_parser
        run: python -m unittest discover -s tests -p test_eprint_harvest.py -v
      - name: Summarize bioRxiv and ChemRxiv source coverage
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write("### Source metadata coverage (cached snapshots, not full archives)\n")
              for name in ("biorxiv","chemrxiv"):
                  path=Path("docs/data")/(name+".json")
                  try:
                      doc=json.loads(path.read_text())
                      count=len(doc.get("papers",[]))
                      stamp=doc.get("generated_at","unknown")
                      complete=doc.get("complete_window") if name=="biorxiv" else doc.get("prefix_exhausted")
                      out.write(f"- {name}: {count} cached records; last success {stamp}; current window/prefix exhausted: {complete}\n")
                  except (OSError,ValueError) as error:
                      out.write(f"- {name}: unavailable; {error}\n")
          PY
      - name: Audit source-count completeness and publish repair queue
        id: coverage_audit
        run: |
          python -m unittest discover -s tests -p test_literature_coverage.py -v
          python -m scripts.audit_literature_coverage
      - name: Build honest four-source freshness summary
        id: freshness_build
        run: |
          python scripts/build_source_freshness.py
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path("docs/data/source-freshness.json").read_text("utf8"))
          assert summary["schema_version"]==1
          assert set(summary["sources"])=={"arxiv","biorxiv","chemrxiv","eprint"}
          assert Path("docs/data/source-freshness.json").stat().st_size < 8000
          PY
      - name: Generate smaller My Feed first-paint preview
        id: feed_preview
        run: |
          python scripts/build_feed_preview.py
          python - <<'PY'
          import json
          from pathlib import Path
          preview=json.loads(Path("docs/data/feed-preview.json").read_text("utf8"))
          assert preview["coverage"]=="recent-preview-only-full-source-snapshots-load-afterward"
          assert len(preview["papers"])>0
          assert Path("docs/data/feed-preview.json").stat().st_size<4_000_000
          PY
      - name: Search ranking and related-paper regression gates
        id: ranking_gate
        run: |
          node tests/research-ranking-benchmark.test.js
          node tests/paper-relations.test.js
      - name: Test normalized source schema and coverage accounting
        run: python -m unittest discover -s tests -p test_normalized_index.py -v
      - name: Build verified monthly source metadata shards
        id: normalized_build
        run: python -m scripts.build_normalized_index
      - name: Build and validate additive canonical v2 source index (required)
        run: |
          python -m unittest discover -s tests -p test_record_contract.py -v
          python -m scripts.build_source_v2
          python - <<'PY'
          from pathlib import Path
          from scripts.build_source_v2 import verify_index
          manifest=verify_index(Path("docs/data/index/v2"))
          assert manifest["record_count"] > 0
          assert not manifest["complete_dates"], "Unverified dates cannot claim complete archive coverage"
          print("Integrity-verified v2 records:",manifest["record_count"])
          PY
      - name: Test versioned taxonomy integrity
        run: python -m unittest discover -s tests -p test_taxonomy_json.py -v
      - name: Build curated versioned topic taxonomy
        id: taxonomy_build
        run: python -m scripts.build_taxonomy_json
      - name: Build source-verified monthly shards and versioned taxonomy
        id: source_shards
        run: |
          python -m unittest discover -s tests -p test_verified_records.py -v
          python scripts/build_verified_records.py
          python scripts/build_taxonomy.py
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("docs/data")
          manifest=json.loads((root/"records/manifest.json").read_text())
          coverage=json.loads((root/"coverage.json").read_text())
          review=json.loads((root/"needs_review.json").read_text())
          taxonomy=json.loads((root/"taxonomy.json").read_text())
          assert sum(manifest["shards"].values())==manifest["record_count"]
          assert manifest["record_count"]==coverage["total_indexed"]==review["count"]
          assert taxonomy["entries"]
          print("Phase 1 coverage, review queue and taxonomy counts validated")
          PY
      - name: Verify every static navigation link and destination
        id: nav_integrity
        run: python -m unittest discover -s tests -p test_navigation_integrity.py -v
      - name: Audit internal routes and HTML assets
        id: audit_internal_routes_and_html_assets
        continue-on-error: true
        run: python scripts/audit_internal_links.py
      - name: Explain any failed required deployment gate
        if: always()
        run: |
          echo '## Required deployment gates' >> "$GITHUB_STEP_SUMMARY"
          echo '| Gate | Result |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          echo '| test metadata processing | ${{ steps.test_metadata_processing.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| security and privacy baseline gate | ${{ steps.security_and_privacy_baseline_gate.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| validate website scripts | ${{ steps.validate_website_scripts.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| assistant relevance | ${{ steps.assistant_relevance.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| assistant exact | ${{ steps.assistant_exact.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| citations exact | ${{ steps.citations_exact.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| source identity | ${{ steps.source_identity.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| comparison extraction | ${{ steps.comparison_extraction.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| bibliography fifty | ${{ steps.bibliography_fifty.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| source harvest | ${{ steps.source_harvest.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| eprint independent | ${{ steps.eprint_independent.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| eprint parser | ${{ steps.eprint_parser.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| coverage audit | ${{ steps.coverage_audit.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| freshness build | ${{ steps.freshness_build.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| feed preview | ${{ steps.feed_preview.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| ranking gate | ${{ steps.ranking_gate.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| normalized build | ${{ steps.normalized_build.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| taxonomy build | ${{ steps.taxonomy_build.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| source shards | ${{ steps.source_shards.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| nav integrity | ${{ steps.nav_integrity.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| brand intro | ${{ steps.brand_intro.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| video validate | ${{ steps.video_validate.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| built assets | ${{ steps.built_assets.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo 'Any required failure above blocks publication. A monitoring-only check after deployment does not undo a published site.' >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize nonblocking pre-deployment checks
        if: always()
        run: |
          echo '## Axiovo validation results (deployment is independently tested)' >> "$GITHUB_STEP_SUMMARY"
          echo '| Test | Outcome |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          echo '| Test metadata processing | ${{ steps.test_metadata_processing.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Security and privacy baseline gate | ${{ steps.security_and_privacy_baseline_gate.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Validate local data restore safety | ${{ steps.validate_local_data_restore_safety.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Validate website scripts | ${{ steps.validate_website_scripts.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Test research relevance ranking | ${{ steps.test_research_relevance_ranking.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Unified research assistant regression tests | ${{ steps.unified_research_assistant_regression_tests.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Test field-interest preferences | ${{ steps.test_field_interest_preferences.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Validate discipline-specific search | ${{ steps.validate_discipline_specific_search.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| AI semantic search precision tests | ${{ steps.ai_semantic_search_precision_tests.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Exact arXiv version and history link tests | ${{ steps.exact_arxiv_version_and_history_link_tests.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Validate shared Discover focus | ${{ steps.validate_shared_discover_focus.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Test rate-limited arXiv fallback and date archive | ${{ steps.test_rate_limited_arxiv_fallback_and_date_archive.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Audit internal routes and HTML assets | ${{ steps.audit_internal_routes_and_html_assets.outcome }} |' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Axiovo meaning in the homepage and video opening
        id: brand_intro
        run: python -m unittest discover -s tests -p test_axiovo_brand_intro.py -v
      - name: Install MP4 verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Validate published tutorial video, captions and narration (required)
        id: video_validate
        run: |
          python - <<'PY'
          from hashlib import file_digest
          import json, subprocess
          from pathlib import Path
          from scripts.tutorial_voice import VOICE, VOICE_ENGINE, VOICE_LOCALE, VOICE_VERSION

          directory = Path("docs/assets")
          video = directory / "axiovo-tour.mp4"
          captions = (directory / "axiovo-tour.vtt").read_text(encoding="utf-8")
          meta = json.loads((directory / "axiovo-tour-build.json").read_text(encoding="utf-8"))
          assert video.is_file() and video.stat().st_size > 100_000, "Tutorial video missing or empty"
          assert captions.startswith("WEBVTT"), "Captions missing"
          assert 20 <= len(meta["chapters"]) == captions.count(" --> "), "Captions and chapter index disagree"
          assert meta.get("source") == "Real Chromium page captures", "Unexpected tutorial source"
          assert meta.get("voice_version") == VOICE_VERSION, "Old tutorial audio was reused"
          assert meta.get("voice_engine") == VOICE_ENGINE, "Unexpected narration engine"
          assert meta.get("voice_locale") == VOICE_LOCALE and meta.get("voices") == [VOICE], "Unexpected tutorial voice"
          with video.open("rb") as media:
              assert file_digest(media, "sha256").hexdigest() == meta.get("media_sha256"), "Video does not match the verified narration"
          probe = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_streams", "-show_format", "-of", "json", str(video)
          ], text=True))
          tracks = probe["streams"]
          assert any(t["codec_type"] == "video" and t["codec_name"] == "h264" for t in tracks), "No H.264 video track"
          assert any(t["codec_type"] == "audio" and t["codec_name"] == "aac" for t in tracks), "No AAC audio track"
          duration = float(probe["format"]["duration"])
          assert duration > 90 and abs(duration - meta["duration_seconds"]) < 0.1, "Tutorial duration does not match"
          subprocess.run(["ffmpeg", "-v", "error", "-i", str(video), "-t", "4", "-f", "null", "-"], check=True)
          print("Verified the committed Indian-English narration, captions, chapter index and playback streams")
          PY
      - name: Install Chromium for independent interaction checks
        id: chromium_deps
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Exercise all current routes and mobile interactions (deployment gate)
        if: steps.chromium_deps.outcome == 'success'
        id: smoke_full
        run: |
          # Retry transient browser/network failures once; never bypass a persistently failing gate.
          python scripts/smoke_routes.py || { sleep 15; python scripts/smoke_routes.py; }
          python scripts/smoke_feed.py
          python scripts/smoke_recommendations.py
          python scripts/smoke_search_links.py
      - name: Exercise existing Discover pages and new Cryptology ePrint source (deployment gate)
        if: steps.chromium_deps.outcome == 'success'
        id: smoke_archives
        run: |
          python scripts/smoke_archive_pages.py
          python scripts/smoke_eprint.py
      - name: Report browser test results
        if: always()
        run: |
          echo 'Browser checks: full ${{ steps.smoke_full.outcome }}, archives ${{ steps.smoke_archives.outcome }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify published website links and new tour bundle
        id: built_assets
        run: python scripts/audit_internal_links.py --built
      - name: Build Atom topic subscriptions
        id: atom_feeds
        continue-on-error: true
        run: python -m scripts.build_feeds
      - name: Report feed generation status
        if: always()
        run: |
          echo 'Atom feeds: ${{ steps.atom_feeds.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.atom_feeds.outcome }}" = "failure" ]; then
            echo '::warning::Atom feed generation failed; video and main website will still deploy.'
          fi
      - name: Identify tested release artifact
        run: python scripts/verify_release.py build
      # Keep the full verified archive committed in docs/. Only the published
      # artifact omits older daily shards, fetched from the same public GitHub
      # repository by arxiv-daily-archive.js with exact manifest validation.
      # This reduces the Pages backend sync workload without deleting data.
      - name: Stage size-bounded GitHub Pages artifact
        id: stage_pages
        run: |
          python scripts/stage_pages.py "$RUNNER_TEMP/axiovo-pages"
          test -f "$RUNNER_TEMP/axiovo-pages/data/arxiv-days/manifest.json"
          test -f "$RUNNER_TEMP/axiovo-pages/assets/axiovo-tour.mp4"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/axiovo-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public release matches tested artifact
        timeout-minutes: 4
        run: python scripts/verify_release.py
      - name: Audit deployed Axiovo pages, live links, navigation and video
        id: postdeploy_audit
        continue-on-error: true
        run: |
          python scripts/audit_live_site.py
        env:
          AXIOVO_BASE_URL: https://pritam-roy-99.github.io/axiovo/
      - name: Explain post-deployment monitoring failure without undoing publication
        if: steps.postdeploy_audit.outcome == 'failure'
        run: |
          echo '::warning::GitHub Pages was deployed, but external live-site monitoring failed. Inspect postdeploy_audit logs; the deployed artifact remains intact.'
          echo '### Live-site monitoring warning' >> "$GITHUB_STEP_SUMMARY"
          echo 'The deployed website may be accessible even though the external verification request failed. This is not evidence that source data or code publication failed.' >> "$GITHUB_STEP_SUMMARY"

