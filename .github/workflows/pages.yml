name: Refresh scholarly metadata and deploy Axiovo
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Hourly checks; extra post-announcement polls improve freshness.
    # GitHub scheduled workflows run on a best-effort basis and may be delayed.
    - cron: '17 * * * *'
    # 20:00 America/New_York is 00:00 UTC in EDT, 01:00 UTC in EST.
    # Dense post-release checks, including late upstream metadata propagation.
    - cron: '10,35 0,1,2,3 * * 1-5'
    # RSS feeds refresh around 00:00 US Eastern, roughly 04:00/05:00 UTC.
    - cron: '5 4,5,6 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: axiovo-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test metadata processing
        run: python -m unittest discover -s tests -v
      - name: Security and privacy baseline gate
        run: python scripts/security_audit.py
      - name: Validate local data restore safety
        run: node tests/local-backup.test.js
      - name: Validate website scripts
        run: python -m scripts.validate_site
      - name: Test research relevance ranking
        run: node tests/relevance.test.js
      - name: Unified research assistant regression tests
        run: |
          node tests/assistant-core.test.js
          node tests/field-taxonomy.test.js
          node tests/author-follow.test.js
          node tests/author-search.test.js
          node tests/inspire-author.test.js
          node tests/multisource-search.test.js
          node tests/zotero-feedback.test.js
          node tests/library-outside-cache.test.js
      - name: Test field-interest preferences
        run: node tests/interests.test.js
      - name: Validate discipline-specific search
        run: node tests/scholar-search.test.js
      - name: AI semantic search precision tests
        run: node tests/semantic-search.test.js
      - name: Exact arXiv version and history link tests
        run: node tests/arxiv-versions.test.js
      - name: Validate shared Discover focus
        run: node tests/focus-bar.test.js
      - name: Test rate-limited arXiv fallback and date archive
        run: |
          node tests/cached-arxiv-search.test.js
          node tests/arxiv-daily-archive.test.js
      - name: Refresh free bioRxiv metadata
        if: github.event_name != 'push'
        id: biorxiv
        continue-on-error: true
        run: python scripts/sync_biorxiv.py
      - name: Report failed bioRxiv synchronization
        if: steps.biorxiv.outcome == 'failure'
        run: |
          echo '### bioRxiv metadata synchronization failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'No live bioRxiv results were available. Cached records are preserved, if any.' >> "$GITHUB_STEP_SUMMARY"
          echo '::warning::bioRxiv synchronization unsuccessful; review diagnostics in logs.'
      - name: Refresh verified ChemRxiv DOI metadata
        id: chemrxiv
        continue-on-error: true
        run: python scripts/sync_chemrxiv.py
      - name: Report unavailable ChemRxiv metadata
        if: steps.chemrxiv.outcome == 'failure'
        run: echo '::warning::ChemRxiv DOI metadata source unavailable; no unverified papers will be displayed.'
      - name: Harvest every arXiv first submission for selected UTC days
        # The independent arXiv archive job runs twice daily; do not make
        # hourly metadata refresh compete for the same upstream API quota.
        if: github.event_name == 'workflow_dispatch'
        id: daily_archive
        continue-on-error: true
        run: python -m scripts.arxiv_daily_archive
      - name: Report incomplete daily archive coverage
        if: steps.daily_archive.outcome == 'failure'
        run: |
          echo '::warning::Complete daily archive harvesting was unavailable; earlier verified day shards remain.'
      - name: Refresh all-category arXiv OAI-PMH metadata
        if: github.event_name != 'push'
        id: oai
        continue-on-error: true
        env:
          OAI_MAX_PAGES: '20'
          OAI_LOOKBACK_DAYS: '2'
        run: python -m scripts.oai_harvest
      - name: Report OAI-PMH ingestion gaps
        if: steps.oai.outcome == 'failure'
        run: |
          echo '::warning::arXiv OAI-PMH ingestion unavailable. Existing OAI snapshot preserved.'
          echo '### All-category OAI source unavailable' >> "$GITHUB_STEP_SUMMARY"
      - name: Harvest official arXiv announcement-day RSS
        # Code pushes deploy existing verified announcements immediately.
        # Scheduled sync and the dedicated announcement workflow update data.
        if: github.event_name != 'push'
        id: announcements
        continue-on-error: true
        run: python -m scripts.arxiv_announcements
      - name: Report unavailable RSS announcements
        if: steps.announcements.outcome == 'failure'
        run: echo '::warning::Official daily announcement RSS unavailable; preserving last verified announcement snapshot.'
      - name: Refresh research metadata
        if: github.event_name != 'push'
        id: refresh
        continue-on-error: true
        run: python scripts/sync.py
      - name: Report synchronization outcome
        if: steps.refresh.outcome == 'failure'
        run: |
          echo '### arXiv synchronization failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'The previous feed is preserved. Check the refresh step logs and retry.' >> "$GITHUB_STEP_SUMMARY"
          echo '::warning::Could not refresh arXiv data. Existing records are preserved.'
      - name: Audit internal routes and HTML assets
        run: python scripts/audit_internal_links.py
      - name: Optional citation metadata enrichment
        if: steps.refresh.outcome == 'success'
        continue-on-error: true
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_BATCH_SIZE: '10'
        run: python -m scripts.enrich
      - name: Commit refreshed feed to default branch
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/feed.json docs/data/biorxiv.json docs/data/chemrxiv.json docs/data/arxiv-days/ docs/data/oai-recent.json docs/data/announcements.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh arXiv index [skip ci]"
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
      - name: Restore cached real-interface homepage tour
        id: tour-cache
        uses: actions/cache@v4
        with:
          path: |
            docs/assets/axiovo-tour.mp4
            docs/assets/axiovo-tour-poster.jpg
            docs/assets/axiovo-tour.vtt
          key: axiovo-three-archives-v5-${{ hashFiles('scripts/build_live_demo.py', 'docs/index.html', 'docs/arxiv.html', 'docs/biorxiv.html', 'docs/chemrxiv.html', 'docs/archive-browser.js', 'docs/archive-browser.css', 'docs/archive-taxonomy.js', 'docs/research-entry.css') }}
      - name: Install Chromium browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check Pillow playwright
          python -m playwright install --with-deps chromium
      - name: Exercise homepage, Discover, Library and critical research actions
        run: python scripts/smoke_routes.py
      - name: Exercise all three dedicated source Discover pages
        run: python scripts/smoke_archive_pages.py
      - name: Install video encoding and feminine voice options
        if: steps.tour-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --disable-pip-version-check edge-tts || echo 'Neural voice unavailable; local feminine narration fallback will be used.'
      - name: Record current Axiovo UI and build homepage tour
        if: steps.tour-cache.outputs.cache-hit != 'true'
        run: python scripts/build_live_demo.py
      - name: Verify homepage video plays and has valid streams
        run: |
          test -s docs/assets/axiovo-tour.mp4
          test -s docs/assets/axiovo-tour-poster.jpg
          test -s docs/assets/axiovo-tour.vtt
          python - <<'PY'
          from pathlib import Path
          import subprocess
          mp4 = Path("docs/assets/axiovo-tour.mp4")
          size = mp4.stat().st_size
          if size < 15000:
              raise SystemExit(f"Tour MP4 unexpectedly small: {size} bytes")
          check = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries",
               "stream=codec_name,codec_type", "-of", "csv=p=0", str(mp4)],
              capture_output=True, text=True, check=True
          )
          streams = check.stdout
          if "h264" not in streams or "video" not in streams:
              raise SystemExit(f"Tour MP4 has no playable H.264 video: {streams!r}")
          print(f"Verified Axiovo MP4: {size:,} bytes, {streams.strip()}")
          PY
      - name: Render first-paint snapshot with actual index counts
        run: python -m scripts.build_snapshot
      - name: Build Atom topic subscriptions
        run: python -m scripts.build_feeds
      - name: Audit internal website links and anchors
        continue-on-error: true
        run: python scripts/audit_site_links.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
