name: Refresh arXiv and deploy ResearchLens
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Hourly checks; extra post-announcement polls improve freshness.
    # GitHub scheduled workflows run on a best-effort basis and may be delayed.
    - cron: '17 * * * *'
    - cron: '47 0,1,2,3,4,5 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: researchlens-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test metadata processing
        run: python -m unittest discover -s tests -v
      - name: Validate website scripts
        run: python -m scripts.validate_site
      - name: Test research relevance ranking
        run: node tests/relevance.test.js
      - name: Unified research assistant regression tests
        run: |
          node tests/assistant-core.test.js
          node tests/field-taxonomy.test.js
      - name: Test field-interest preferences
        run: node tests/interests.test.js
      - name: Validate discipline-specific search
        run: node tests/scholar-search.test.js
      - name: Refresh research metadata
        id: refresh
        continue-on-error: true
        run: python scripts/sync.py
      - name: Report synchronization outcome
        if: steps.refresh.outcome == 'failure'
        run: |
          echo '### arXiv synchronization failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'The previous feed is preserved. Check the refresh step logs and retry.' >> "$GITHUB_STEP_SUMMARY"
          echo '::warning::Could not refresh arXiv data. Existing records are preserved.'
      - name: Optional citation metadata enrichment
        if: steps.refresh.outcome == 'success'
        continue-on-error: true
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_BATCH_SIZE: '10'
        run: python -m scripts.enrich
      - name: Commit refreshed feed to default branch
        if: steps.refresh.outcome == 'success' && github.event_name != 'push'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/feed.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh arXiv index [skip ci]"
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
      - name: Restore cached homepage video
        id: tour-cache
        uses: actions/cache@v4
        with:
          path: |
            docs/assets/researchlens-tour.mp4
            docs/assets/researchlens-tour-poster.jpg
            docs/assets/researchlens-tour.vtt
          key: researchlens-homepage-tour-${{ hashFiles('scripts/build_intro_video.py') }}
      - name: Build self-hosted homepage explainer
        if: steps.tour-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --disable-pip-version-check Pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python scripts/build_intro_video.py
      - name: Verify homepage video assets
        run: |
          test -s docs/assets/researchlens-tour.mp4
          test -s docs/assets/researchlens-tour-poster.jpg
          test -s docs/assets/researchlens-tour.vtt
      - name: Render first-paint snapshot with actual index counts
        run: python -m scripts.build_snapshot
      - name: Build Atom topic subscriptions
        run: python -m scripts.build_feeds
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
