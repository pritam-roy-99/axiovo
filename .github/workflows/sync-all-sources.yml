name: Synchronize all scholarly archives
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-all-sources.yml'
      - 'scripts/arxiv_catchup.py'
      - 'scripts/sync_biorxiv.py'
      - 'tests/test_source_harvest.py'
      - 'scripts/validate_sync_snapshots.py'
  workflow_dispatch:
  schedule:
    # Every 30 minutes; publication occurs only when validated source files change.
    # A second watchdog now also runs after Pages releases to recover missed cron runs.
    # GitHub Actions scheduled start times are approximate, not guaranteed.
    - cron: '7,37 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: axiovo-all-sources
  cancel-in-progress: false
jobs:
  announcements:
    # Publish early listings without waiting for OAI or any other archive.
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Report scheduler trigger and expected cadence
        run: |
          echo "## Archive scheduler" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Started (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_STEP_SUMMARY"
          echo "- Expected schedule: minute 07 and 37 of each UTC hour (30-minute cadence)" >> "$GITHUB_STEP_SUMMARY"
          echo "- A successful run does not guarantee newer source records." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify announcement ingestion
        run: python -m unittest discover -s tests -p 'test_arxiv*.py' -v
      - name: Synchronize arXiv announcements
        id: arxiv_announcements
        continue-on-error: true
        run: |
          # arXiv catch-up pages become public after 20:00 US Eastern,
          # before the RSS/Atom refresh at midnight Eastern (05:00 UTC in EST).
          # The Atom submission timestamp cannot certify announcement dates.
          if [ "$(date -u +%u)" -ge 6 ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "arXiv announcements: weekend pause, preserving last release."
            exit 0
          fi
          hour=$(date -u +%H)
          if [ "$hour" -lt 5 ]; then
            timeout --signal=TERM --kill-after=10s 360s python -m scripts.arxiv_catchup || timeout --signal=TERM --kill-after=10s 360s python -m scripts.arxiv_announcements
          else
            # RSS is the official completeness check. If it is stale or not
            # available, the direct catch-up pages can still advance the day.
            # RSS is authoritative once complete. Do not refetch all catch-up
            # pages after a complete RSS census: that caused avoidable 429s.
            timeout --signal=TERM --kill-after=10s 300s python -m scripts.arxiv_announcements || true
            if python - <<'PY'
          import json
          from pathlib import Path
          from scripts.arxiv_catchup import target_announcement_date
          p = Path("docs/data/announcements.json")
          batch = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
          raise SystemExit(0 if batch.get("complete") and batch.get("announcement_date") == target_announcement_date() else 1)
          PY
            then
              echo "Complete current official RSS announcement: skip rate-limited catch-up requests."
            else
              # Incomplete RSS must retain its best available verified snapshot.
              timeout --signal=TERM --kill-after=10s 300s python -m scripts.arxiv_catchup || true
            fi
          fi
      - name: Validate announcement snapshot
        run: |
          git fetch origin main
          python scripts/validate_sync_snapshots.py announcements.json
      - name: Publish changed announcement only
        id: publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/announcements.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'data: publish verified arXiv announcement [skip ci]'
            # Other archive jobs own disjoint snapshots. Never resolve a
            # conflicting announcement by silently choosing the stale side.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger checked publication of the announcement
        if: steps.publication.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
      - name: Report announcement synchronization
        if: always()
        run: echo 'Announcement fetch outcome ${{ steps.arxiv_announcements.outcome }}. A successful fetch is not proof of a complete release; consult the snapshot date and coverage.' >> "$GITHUB_STEP_SUMMARY"
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test metadata harvesters
        run: |
          python -m unittest discover -s tests -p 'test_source_harvest.py' -v
          python -m unittest discover -s tests -p 'test_arxiv_catchup.py' -v
          python -m unittest discover -s tests -p 'test_arxiv_announcement_order.py' -v
          python -m unittest discover -s tests -p 'test_eprint_harvest.py' -v
          python -m unittest discover -s tests -p 'test_sync_snapshots.py' -v
      - name: Synchronize arXiv all-category OAI metadata
        id: arxiv_oai
        continue-on-error: true
        env:
          OAI_LOOKBACK_DAYS: '3'
          OAI_MAX_PAGES: '8'
        run: |
          # OAI datestamps reflect metadata changes, not announcement days.
          # Harvest every scheduled run, including weekends, to catch revisions.
          timeout --signal=TERM --kill-after=10s 180s python -m scripts.oai_harvest
      - name: Rebuild arXiv rolling feed
        id: arxiv_feed
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=10s 120s python -m scripts.sync
      - name: Synchronize official bioRxiv API
        id: biorxiv
        continue-on-error: true
        env:
          # Refresh latest bioRxiv updates inside the Actions time budget.
          # Previously published records remain preserved between windows.
          AXIOVO_BIORXIV_LOOKBACK_DAYS: '4'
          PYTHONUNBUFFERED: '1'
        run: timeout --signal=TERM --kill-after=10s 180s python -m scripts.sync_biorxiv
      - name: Synchronize verified ChemRxiv records
        id: chemrxiv
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=10s 150s python -m scripts.sync_chemrxiv
      - name: Synchronize Cryptology ePrint OAI
        id: eprint
        continue-on-error: true
        env:
          IACR_LOOKBACK_DAYS: '21'
          IACR_MAX_PAGES: '20'
        run: timeout --signal=TERM --kill-after=10s 150s python -m scripts.sync_eprint
      - name: Validate and preserve source integrity
        id: integrity
        run: |
          git fetch origin main
          python scripts/validate_sync_snapshots.py feed.json oai-recent.json biorxiv.json chemrxiv.json eprint.json
      - name: Summarize synchronization outcomes
        if: always()
        env:
          ARXIV_OAI: ${{ steps.arxiv_oai.outcome }}
          ARXIV_FEED: ${{ steps.arxiv_feed.outcome }}
          BIORXIV: ${{ steps.biorxiv.outcome }}
          CHEMRXIV: ${{ steps.chemrxiv.outcome }}
          EPRINT: ${{ steps.eprint.outcome }}
        run: |
          echo '## Archive source synchronization' >> "$GITHUB_STEP_SUMMARY"
          for name in ARXIV_OAI ARXIV_FEED BIORXIV CHEMRXIV EPRINT; do
            echo "- ${name}: ${!name}" >> "$GITHUB_STEP_SUMMARY"
          done
          echo 'An unsuccessful source retains its previously verified snapshot. Source availability is not proof of complete historical coverage.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish new verified source snapshots
        id: publication
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/feed.json docs/data/oai-recent.json docs/data/biorxiv.json docs/data/chemrxiv.json docs/data/eprint.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'data: synchronize verified scholarly sources [skip ci]'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger full site publication after source update
        if: steps.publication.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
      - name: Report degraded synchronization without blocking verified archives
        if: always()
        env:
          ARXIV_OAI: ${{ steps.arxiv_oai.outcome }}
          ARXIV_FEED: ${{ steps.arxiv_feed.outcome }}
          BIORXIV: ${{ steps.biorxiv.outcome }}
          CHEMRXIV: ${{ steps.chemrxiv.outcome }}
          EPRINT: ${{ steps.eprint.outcome }}
        run: |
          failed=0
          for name in ARXIV_OAI ARXIV_FEED BIORXIV CHEMRXIV EPRINT; do
            if [ "${!name}" = 'failure' ]; then
              echo "::warning::${name} failed. Previously verified metadata was retained."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo '### Sync degraded: at least one upstream source failed; cached data retained and freshness must not be claimed.' >> "$GITHUB_STEP_SUMMARY"
          fi
          # Source outages are reported as degraded, not a false deployment failure.
          # Integrity checks and required parser tests remain blocking.
