name: Diagnose arXiv OAI metadata (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: axiovo-oai-mirror
  cancel-in-progress: false
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test OAI parser
        run: python -m unittest discover -s tests -v
      - name: Harvest recent OAI records
        run: python -m scripts.oai_harvest
