name: Test GitHub-only arXiv history storage
on:
  pull_request:
    paths:
      - '.github/workflows/arxiv-history-github-storage.yml'
      - '.github/workflows/test-arxiv-history-github-storage.yml'
      - 'tests/test_arxiv_history_github_storage.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_arxiv_history_github_storage.py' -v
