name: Audit complete Axiovo page UI
on:
  push:
    branches:
      - design/full-page-blueprint-v4-20261111
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Inspect all active desktop/mobile routes and take screenshots
        run: python scripts/capture_page_design_v4.py
      - name: Upload screenshots and geometry manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axiovo-full-page-v4-visual-audit
          path: ui-page-v4/
          retention-days: 7
