<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Field search has moved to Discover | ResearchLens</title><meta name="description" content="The Field Explorer and arXiv feed are now combined in ResearchLens Discover.">
<link rel="canonical" href="https://pritam-roy-99.github.io/researchlens/?view=scholarly#discover">
<meta http-equiv="refresh" content="2;url=./?view=scholarly#discover">
<script>
(function(){
 const old=new URLSearchParams(location.search);
 const next=new URL("./",location.href);
 old.forEach((v,k)=>{if(k!=="view")next.searchParams.set(k,v)});
 next.searchParams.set("view","scholarly");next.hash="discover";
 location.replace(next.href)
})();
</script>
