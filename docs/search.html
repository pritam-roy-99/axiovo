<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Axiovo Discover | Search arXiv-hosted research</title>
<meta name="description" content="Global search is now integrated into field-aware Axiovo Discover.">
<link rel="canonical" href="https://pritam-roy-99.github.io/axiovo/?view=scholarly#discover">
<link rel="stylesheet" href="./theme.css"><link rel="stylesheet" href="./workspace.css">
<script>
(function(){
 const previous=new URLSearchParams(location.search);
 const next=new URL("./discover.html",location.href);
 previous.forEach((value,key)=>{if(key!=="view")next.searchParams.set(key,value)});
 next.searchParams.set("view","scholarly");
 next.hash="discover";
 location.replace(next.href);
})();
</script>
</head><body>
<main class="rl-workspace" style="max-width:740px;margin:45px auto;padding:20px">
<h1>Global Search is now part of Discover</h1>
<p>Axiovo uses one field-aware search for arXiv-hosted papers rather than separate search screens with inconsistent filters.</p>
<p><a href="./discover.html?view=scholarly#discover">Open Discover</a></p>
</main></body></html>
