<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Redirecting to Axiovo | Axiovo</title>
<link rel="stylesheet" href="./theme.css">
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:740px;margin:10vh auto;padding:24px;background:#f4f7fa;color:#15324b}a{color:#126f9c}a:focus-visible{outline:3px solid #126f9c;outline-offset:3px}</style>
<script>
(function(){
  "use strict";
  const old=new URL(location.href);
  const params=old.searchParams;
  const archive=(params.get("archive")||params.get("view")||"").toLowerCase();
  const options={arxiv:"arxiv.html",biorxiv:"biorxiv.html",chemrxiv:"chemrxiv.html"};
  const isLibrary=old.hash==="#workspace"||old.hash==="#library"||params.get("view")==="workspace";
  const isSearch=["q","query","author","from","to","date","sort","category","topic","subtopic","refine"].some(k=>params.has(k));
  const selected=isLibrary?"workspace.html":options[archive]||(isSearch||archive==="scholarly"?"arxiv.html":"");
  const target=new URL(selected?"./"+selected:"./",old);
  if(!isLibrary&&selected!==""){
    for(const key of ["q","query","author","affiliation","from","to","date","sort","category","topic","subtopic","refine","match","crosslisted"]){
      if(params.has(key))target.searchParams.set(key,params.get(key));
    }
  }
  location.replace(target.href);
})();
</script>
</head>
<body>
<main><h1>Axiovo has moved to separate archive pages</h1>
<p>Choose <a href="./arxiv.html">arXiv</a>, <a href="./biorxiv.html">bioRxiv</a>, or <a href="./chemrxiv.html">ChemRxiv</a>. Your <a href="./workspace.html">Library</a> has its own page.</p>
<p>Existing browser-saved research data is not cleared by this redirect.</p></main>
</body></html>
